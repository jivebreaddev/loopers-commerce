[project]
name = "llm-gateway"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "llm-routing", "token-billing", "llm-monitoring",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
llm-routing = { workspace = true }
token-billing = { workspace = true }
llm-monitoring = { workspace = true }
