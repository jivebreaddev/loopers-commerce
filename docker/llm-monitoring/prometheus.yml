global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: llm-gateway
    static_configs:
      - targets: [gateway:8000]
  # GPU-profile service addresses. Change targets when connecting host/remote servers.
  - job_name: vllm-primary
    static_configs:
      - targets: [vllm-primary:8000]
  - job_name: vllm-fallback
    static_configs:
      - targets: [vllm-fallback:8000]
